<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#FFFFFF; --bg-alt:#F5F5F7; --fg:#111827; --muted:#6B7280;
  --accent:#6366F1; --accent-soft:#EEF0FE; --success:#0D9488; --success-soft:#E6F5F3;
  --warn:#D97706; --warn-soft:#FDF2E3; --line:#E5E7EB; --card:#FFFFFF; --shadow:0 1px 2px rgba(17,24,39,.05);
  --t-eyebrow:22px; --t-title:60px; --t-h2:44px; --t-body:30px; --t-small:24px; --t-chip:20px;
  --pad-x:120px; --pad-y:88px; --gap:28px; --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D12; --bg-alt:#141821; --fg:#F3F4F6; --muted:#9CA3AF;
    --accent:#818CF8; --accent-soft:#1D2030; --success:#2DD4BF; --success-soft:#12241F;
    --warn:#F59E0B; --warn-soft:#2A2013; --line:#262C38; --card:#141821; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D12; --bg-alt:#141821; --fg:#F3F4F6; --muted:#9CA3AF;
  --accent:#818CF8; --accent-soft:#1D2030; --success:#2DD4BF; --success-soft:#12241F;
  --warn:#F59E0B; --warn-soft:#2A2013; --line:#262C38; --card:#141821; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);overflow-x:hidden}
body{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     -webkit-font-smoothing:antialiased;font-weight:400}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- stage ---------- */
.stage{position:fixed;left:50%;top:calc(50% - 26px);width:1920px;height:1080px;
       transform-origin:center center;transform:translate(-50%,-50%) scale(.5);background:var(--bg)}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
       padding:var(--pad-y) var(--pad-x) 104px;background:var(--bg)}
.slide.active{display:flex}
.eyebrow{font-size:var(--t-eyebrow);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
         font-weight:600;margin:0 0 22px}
h1{font-size:var(--t-title);line-height:1.08;letter-spacing:-.02em;font-weight:600;margin:0 0 28px;max-width:23ch}
h2{font-size:var(--t-h2);line-height:1.12;letter-spacing:-.02em;font-weight:600;margin:0 0 34px}
p{font-size:var(--t-body);line-height:1.42;color:var(--muted);margin:0}
.lead{color:var(--fg);max-width:34ch}
.thesis{font-size:36px;line-height:1.4;color:var(--fg);max-width:40ch;font-weight:400;
        border-left:5px solid var(--accent);padding-left:32px}
.slide-foot{position:absolute;left:var(--pad-x);right:var(--pad-x);bottom:44px;display:flex;
            justify-content:space-between;align-items:center;font-size:var(--t-chip);color:var(--muted);
            border-top:1px solid var(--line);padding-top:20px;letter-spacing:.02em}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:var(--gap)}

/* ---------- pieces ---------- */
.cols{display:flex;gap:36px;align-items:stretch}
.cols>*{flex:1 1 0;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:34px 36px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.card.alt{background:var(--bg-alt)}
.card h3{font-size:30px;margin:0;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
.card .kicker{font-size:var(--t-chip);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin:0}
.k-accent{color:var(--accent)} .k-success{color:var(--success)} .k-warn{color:var(--warn)}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
li{font-size:var(--t-body);line-height:1.34;color:var(--muted);padding-left:32px;position:relative}
li::before{content:"";position:absolute;left:6px;top:.55em;width:10px;height:10px;border-radius:3px;background:var(--accent)}
li.ok::before{background:var(--success)} li.warn::before{background:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:var(--t-chip);font-weight:600;letter-spacing:.02em;padding:7px 14px;border-radius:999px;
      background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.chip.s{background:var(--success-soft);color:var(--success)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.ghost{background:transparent;color:var(--muted);border-color:var(--line)}

/* chain diagram */
.chain{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap}
.node{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:26px 22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.node .n{font-size:var(--t-chip);font-weight:700;color:var(--accent);letter-spacing:.06em}
.node .t{font-size:26px;line-height:1.25;color:var(--fg);font-weight:500}
.arrow{flex:0 0 56px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:34px}
.arrow::after{content:"→"}
.rails{display:flex;gap:20px;margin-top:22px}
.rail{flex:1 1 0;border:1px dashed var(--line);border-radius:14px;padding:18px 24px;background:var(--bg-alt);
      font-size:26px;color:var(--muted);display:flex;align-items:center;gap:14px}
.rail b{color:var(--fg);font-weight:600}

/* loop diagram */
.loop{display:flex;align-items:center;gap:0;flex-wrap:nowrap}
.loop .node{flex:0 1 auto}
.loopback{font-size:24px;color:var(--success);border:1px dashed var(--success);border-radius:999px;
          padding:10px 20px;margin-left:20px;white-space:nowrap}

/* stage table */
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:24px;background:var(--card);border:1px solid var(--line);
     border-radius:14px;padding:20px 28px;box-shadow:var(--shadow)}
.row .st{flex:0 0 460px;font-size:28px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:16px}
.row .num{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
          display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.row .crit{flex:1 1 auto;font-size:26px;color:var(--muted);line-height:1.3}
.row.pilot .num{background:var(--warn-soft);color:var(--warn)}
.row.pilot .st{color:var(--warn)}

.ask{margin-top:8px;font-size:32px;line-height:1.35;color:var(--fg);background:var(--accent-soft);
     border-radius:16px;padding:26px 32px}
.ask b{font-weight:600;color:var(--accent)}
.big{font-size:72px;font-weight:600;letter-spacing:-.03em;color:var(--accent);line-height:1}
.note{font-size:var(--t-small);color:var(--muted);line-height:1.35}
.rule{font-size:28px;color:var(--fg);background:var(--warn-soft);border-left:5px solid var(--warn);
      border-radius:0 14px 14px 0;padding:22px 28px;line-height:1.35}

/* ---------- controls ---------- */
.controls{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:16px;
          padding:0 20px;background:color-mix(in srgb, var(--bg) 88%, transparent);
          backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20;font-size:14px}
.progress{position:fixed;left:0;top:0;height:3px;background:var(--accent);width:0%;z-index:30;
          transition:width .25s ease}
button{font:inherit;font-family:inherit;color:var(--fg);background:var(--bg-alt);border:1px solid var(--line);
       border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:500;line-height:1.2}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08);color:#fff}
.counter{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.hint{color:var(--muted)}
.clickzone{position:fixed;top:0;bottom:52px;width:34%;z-index:10;cursor:pointer}
.clickzone.left{left:0} .clickzone.right{right:0}
/* capture mode: chrome-free full-bleed stage for screenshots/video */
body.clean .controls,body.clean .clickzone{display:none}
body.clean .stage{top:50%}

/* ---------- phone / flow mode ---------- */
@media (max-width:900px){
  :root{--t-eyebrow:12px;--t-title:28px;--t-h2:22px;--t-body:16px;--t-small:14px;--t-chip:12px;
        --pad-x:20px;--pad-y:22px;--gap:16px;--radius:14px}
  .stage{position:static;width:100%;height:auto;transform:none!important}
  .slide{position:static;min-height:calc(100vh - 52px);padding:var(--pad-y) var(--pad-x) 84px}
  .slide.active{display:flex}
  h1{max-width:none}
  .thesis{font-size:17px;padding-left:14px;border-left-width:3px;max-width:none}
  .slide-foot{position:static;margin-top:18px;left:auto;right:auto;bottom:auto;font-size:11px;padding-top:12px}
  .body{justify-content:flex-start;gap:14px}
  .cols{flex-direction:column;gap:14px}
  .card{padding:16px 18px;gap:10px}
  .card h3{font-size:17px}
  li{font-size:15px;padding-left:20px}
  li::before{width:7px;height:7px;left:2px}
  .chain,.loop{flex-direction:column}
  .node{padding:12px 14px;gap:6px}
  .node .t{font-size:15px}
  .arrow{flex:0 0 26px;font-size:18px;transform:rotate(90deg)}
  .rails{flex-direction:column;gap:10px;margin-top:12px}
  .rail{font-size:14px;padding:10px 14px}
  .loopback{font-size:13px;margin:10px 0 0;text-align:center}
  .rows{gap:8px}
  .row{flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px}
  .row .st{flex:none;font-size:15px;gap:10px}
  .row .num{width:26px;height:26px;font-size:13px;border-radius:8px}
  .row .crit{font-size:14px}
  .ask{font-size:16px;padding:14px 16px}
  .big{font-size:34px}
  .rule{font-size:15px;padding:12px 14px}
  .clickzone{display:none}
  .controls{font-size:12px;gap:10px;padding:0 16px}
  button{padding:6px 12px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<div class="stage" id="stage">
<!--__SLIDES__-->
</div>

<div class="clickzone left"  id="zone-left"  aria-hidden="true"></div>
<div class="clickzone right" id="zone-right" aria-hidden="true"></div>

<div class="controls">
  <button class="primary" id="play" data-ui>▶ Play narration</button>
  <button id="prev" data-ui aria-label="Previous slide">←</button>
  <button id="next" data-ui aria-label="Next slide">→</button>
  <button id="theme" data-ui aria-label="Toggle theme">◐</button>
  <span class="hint">Arrow keys, or click either side</span>
  <span class="counter" id="counter">1 / –</span>
</div>

<script>
(function(){
  "use strict";
  var AUDIO = /*__AUDIO__*/{};
  var TOTAL = document.querySelectorAll('.slide').length;
  var stage = document.getElementById('stage');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var counter = document.getElementById('counter');
  var progress = document.getElementById('progress');
  var playBtn = document.getElementById('play');
  var audio = new Audio();
  var playing = false;
  var cur = 1;

  function narrow(){ return window.matchMedia('(max-width:900px)').matches; }

  function fit(){
    if (narrow()){ stage.style.transform = ''; return; }
    var reserve = document.body.classList.contains('clean') ? 0 : 52;
    var s = Math.min(window.innerWidth / 1920, (window.innerHeight - reserve) / 1080);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  function show(n, opts){
    n = Math.min(TOTAL, Math.max(1, n));
    cur = n;
    slides.forEach(function(s, i){ s.classList.toggle('active', i === n - 1); });
    counter.textContent = n + ' / ' + TOTAL;
    Array.prototype.forEach.call(document.querySelectorAll('.pageno'), function(el){
      el.textContent = n + ' / ' + TOTAL;
    });
    progress.style.width = (n / TOTAL * 100) + '%';
    if (history.replaceState) history.replaceState(null, '', '#slide-' + n);
    else location.hash = 'slide-' + n;
    if (narrow()) window.scrollTo(0, 0);
    if (playing && !(opts && opts.silent)) speak(n);
  }

  function speak(n){
    var src = AUDIO['slide-' + (n < 10 ? '0' + n : n)];
    if (!src){ playing = false; setPlayLabel(); return; }
    audio.src = src;
    var p = audio.play();
    if (p && p.catch) p.catch(function(){ playing = false; setPlayLabel(); });
    setPlayLabel();
  }

  function setPlayLabel(){
    playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play narration';
    playBtn.classList.toggle('primary', !playing);
  }

  audio.addEventListener('ended', function(){
    if (!playing) return;
    if (cur < TOTAL) show(cur + 1);
    else { playing = false; setPlayLabel(); }
  });

  playBtn.addEventListener('click', function(){
    if (playing){ playing = false; audio.pause(); setPlayLabel(); return; }
    playing = true;
    if (audio.src && audio.currentTime > 0 && !audio.ended) { audio.play(); setPlayLabel(); }
    else speak(cur);
  });

  document.getElementById('next').addEventListener('click', function(){ show(cur + 1); });
  document.getElementById('prev').addEventListener('click', function(){ show(cur - 1); });
  document.getElementById('zone-right').addEventListener('click', function(){ show(cur + 1); });
  document.getElementById('zone-left').addEventListener('click', function(){ show(cur - 1); });

  document.getElementById('theme').addEventListener('click', function(){
    var root = document.documentElement;
    var dark = getComputedStyle(root).getPropertyValue('--bg').trim().toLowerCase().indexOf('#0b') === 0;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); show(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home'){ show(1); }
    else if (e.key === 'End'){ show(TOTAL); }
    else if (e.key === ' '){ e.preventDefault(); playBtn.click(); }
  });

  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var m = /slide-(\d+)/.exec(location.hash);
    if (m && +m[1] !== cur) show(+m[1], {silent:true});
  });

  if (/clean/.test(location.search) || /clean/.test(location.hash)) document.body.classList.add('clean');
  var m = /slide-(\d+)/.exec(location.hash);
  fit();
  show(m ? +m[1] : 1, {silent:true});
  setPlayLabel();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
